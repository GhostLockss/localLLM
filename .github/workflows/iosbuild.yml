
name: Build Priv AI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          repository: GhostLockss/localLLM
          path: localLLM

      - name: Checkout Swiftlet
        uses: actions/checkout@v4
        with:
          repository: GhostLockss/Swiftlet
          path: swiftlet

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build app
        working-directory: localLLM
        run: |
          xcodebuild \
            -project localLLM.xcodeproj \
            -scheme localLLM \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
